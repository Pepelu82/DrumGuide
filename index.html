<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DrumGuide</title>
  <link rel="manifest" href="./manifest.webmanifest?v=10.35.0" />
  <link rel="icon" href="./icon.svg?v=10.35.0" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png?v=10.35.0" />
  <link rel="stylesheet" href="./styles.css?v=10.35.0" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="./icon.svg" alt="" />
        <div><strong>DrumGuide</strong><span>Guías para batería</span></div>
      </div>
      <nav id="sideNav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="syncBadge" class="sync-badge">● Sincronizando…</div>
        <div class="version-line"><span id="versionBadge">v10.35.0</span><span>Versión GitHub Pages · publicación gratuita</span></div>
        <a class="btn primary full" href="https://github.com/Pepelu82/DrumGuide" target="_blank" rel="noopener">↗ Abrir proyecto en GitHub</a>
        <button class="btn ghost full" data-action="update">↻ Comprobar actualización</button>
        <button class="btn ghost full" data-action="backup">Crear copia de seguridad</button>
        <button class="btn ghost full" data-action="restore">Restaurar copia</button>
        <input id="restoreInput" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Inicio</h1>
          <p id="pageSubtitle">Tu repertorio, guías y directo en un solo lugar.</p>
        </div>
        <div class="top-actions">
          <button id="installBtn" class="btn ghost" hidden>Instalar app</button>
          <button class="btn primary" data-action="new-song">+ Canción</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <nav id="bottomNav" class="bottom-nav"></nav>

  <dialog id="modal" class="modal">
    <form class="modal-card" id="modalForm">
      <div class="modal-head">
        <h2 id="modalTitle">Editar</h2>
        <button type="button" class="icon-btn" data-modal-cancel aria-label="Cerrar">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-modal-cancel>Cancelar</button>
        <button id="modalSave" type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js?v=10.35.0"></script>
</body>
</html>
